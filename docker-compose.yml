services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GRAPHQL_URL: http://localhost:3000/graphql
        VITE_CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-Asia/Kolkata}
    ports: ["5173:80"]
    depends_on: [api]
  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: "mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongo:27017/clinic?authSource=clinic&replicaSet=rs0"
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.development before starting the stack}
      OTP_DELIVERY: mock
      STAFF_USERS: ${STAFF_USERS:-+15555550100:ADMIN,+15555550101:RECEPTIONIST}
      TOTP_SECRETS: ${TOTP_SECRETS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      CORS_ORIGIN: http://localhost:5173
    ports: ["3000:3000"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
  mongo:
    image: mongo:7
    entrypoint: ["/bin/sh", "/usr/local/bin/start-with-auth.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: clinic
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/mongo/start-with-auth.sh:/usr/local/bin/start-with-auth.sh:ro
      - ./infrastructure/mongo/create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}] }).ok }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  mongo-data:
